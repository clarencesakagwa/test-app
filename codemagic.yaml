workflows:
  android-apk:
    name: Build Clam TV APK
    max_build_duration: 30
    instance_type: linux_x2
    environment:
      groups: []
      vars:
        PACKAGE_NAME: "app.wapa.clamj52mn"
    scripts:
      - name: Build APK
        script: |
          gradle assembleRelease --no-daemon
    artifacts:
      - app/build/outputs/apk/**/*.apk
    publishing:
      email:
        recipients: []